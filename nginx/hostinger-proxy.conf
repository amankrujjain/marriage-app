# Drop-in for the VPS host nginx (already listening on 80/443).
# Install path: /etc/nginx/sites-available/marriagebio.in
# Then: ln -sf ... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# Start HTTP-only so certbot can issue certs. After DNS points here:
#   certbot --nginx -d marriagebio.in -d www.marriagebio.in
# Certbot will add the 443/ssl block automatically.

upstream marriagebio_web {
  server 127.0.0.1:4010;
  keepalive 32;
}

upstream marriagebio_api {
  server 127.0.0.1:4020;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name marriagebio.in www.marriagebio.in;

  client_max_body_size 12m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://marriagebio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://marriagebio_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
