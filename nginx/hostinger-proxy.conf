# Drop-in for the VPS host nginx (already listening on 80/443).
# Do NOT use with docker-compose nginx — that service was removed.
#
# Typical install on Hostinger VPS:
#   1. Copy or symlink this file into /etc/nginx/sites-available/marriagebio.in
#   2. Adjust ssl_certificate paths to your Hostinger / Let's Encrypt certs
#   3. ln -s /etc/nginx/sites-available/marriagebio.in /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# Compose must be up so 127.0.0.1:4010 (web) and :4020 (api) are listening.

upstream marriagebio_web {
  server 127.0.0.1:4010;
  keepalive 32;
}

upstream marriagebio_api {
  server 127.0.0.1:4020;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name marriagebio.in www.marriagebio.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name marriagebio.in www.marriagebio.in;

  # Point these at Hostinger SSL or certbot paths on the VPS
  ssl_certificate     /etc/nginx/ssl/marriagebio.in/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/marriagebio.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://marriagebio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://marriagebio_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
